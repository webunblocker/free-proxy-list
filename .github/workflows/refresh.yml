name: Refresh Proxy Snapshot

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-free-proxy-list
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      REPO_SLUG: webunblocker/free-proxy-list
      REPO_BRANCH: main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh snapshot
        env:
          API_BASE_URL: https://api.socks5proxies.com
          PROXYLIST_API_KEY: ${{ secrets.PROXYLIST_API_KEY }}
          SITE_URL: https://socks5proxies.com
        run: node scripts/refresh.mjs

      - name: Validate snapshot
        run: node scripts/validate.mjs

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git add README.md proxies
          git commit -m "chore(data): refresh proxy snapshot"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # jsDelivr keeps @branch files 12 h at the edge, longer than the refresh interval, and its
      # origin can go on serving the previous commit for two hours or more after a push (purged
      # 65-102 min after one, every file came back old; from 107 min some came back new); a path
      # can be purged about once an hour (later requests come back "throttled"). So purge in rounds:
      # 5 min after the push purge every changed or removed path, compare each changed file on
      # cdn.jsdelivr.net with this commit, and purge the ones that differ again once their throttle
      # has reset, until all match or the budget runs out. jsDelivr's state is outside this repo,
      # so what is still older at the end is a warning, not a failed run (2026-10-19 measurements
      # in socks5proxies docs/ROADMAP-STATUS.md).
      - name: Purge jsDelivr cache
        if: steps.commit.outputs.pushed == 'true'
        env:
          BUDGET_MINUTES: "300"
        run: |
          deadline=$(( $(date +%s) + BUDGET_MINUTES * 60 ))
          todo=$(git diff --name-only HEAD~1 HEAD -- README.md proxies)
          served=$(mktemp)
          round=1
          sleep 300
          while :; do
            reset=0
            for p in $todo; do
              r=$(curl -fsS --retry 3 --retry-all-errors "https://purge.jsdelivr.net/gh/${REPO_SLUG}@${REPO_BRANCH}/$p")
              t=$(echo "$r" | jq '[.paths[] | select(.throttled) | .throttlingReset] | max // 0')
              [ "$t" -gt "$reset" ] && reset=$t
            done
            stale=""
            for p in $todo; do
              [ -f "$p" ] || continue
              if ! curl -fsS --retry 3 --retry-all-errors -o "$served" "https://cdn.jsdelivr.net/gh/${REPO_SLUG}@${REPO_BRANCH}/$p" || ! cmp -s "$served" "$p"; then
                stale="$stale $p"
              fi
            done
            echo "Round $round: purged $(echo $todo | wc -w) paths, $(echo $stale | wc -w) not yet served from this commit"
            [ -z "$stale" ] && exit 0
            next=$(( reset > 0 ? reset + 60 : 3660 ))
            [ $(( $(date +%s) + next )) -gt "$deadline" ] && break
            sleep "$next"
            todo=$stale
            round=$((round + 1))
          done
          for p in $stale; do echo "::warning::jsDelivr does not serve this commit's $p yet"; done
